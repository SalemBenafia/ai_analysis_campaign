insightai:
  target: prod
  outputs:
    prod:
      type: duckdb
      path: ":memory:"
      threads: 1
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'minio:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD', 'minio_secret_123') }}"
        s3_use_ssl: false
        s3_url_style: path
        s3_region: us-east-1
